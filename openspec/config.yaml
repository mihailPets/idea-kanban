schema: spec-driven

# Контекст проекта (необязательно)
# OpenSpec передаёт его при подготовке артефактов.
# Здесь можно указать стек, соглашения и предметную область.
# Пример:
#   context: |
#     Стек: TypeScript, React, Node.js
#     Для коммитов используем Conventional Commits.
#     Предметная область: электронная коммерция.

# Правила для отдельных артефактов (необязательно)
# Пример:
#   rules:
#     proposal:
#       - Описывайте предложение не более чем в 500 словах.
#       - Указывайте, что выходит за рамки изменений.
#     tasks:
#       - Делите работу на задачи длительностью до двух часов.

# Инструкции для операций (необязательно)
# Подсказывают, как применять и архивировать изменения.
# Пример:
#   operations:
#     apply:
#       guidance:
#         - Кратко описывайте результаты тестов.
#     archive:
#       guidance:
#         - Сообщайте итог архивирования перед завершением.
